[project]
name = "local-speech-to-text"
version = "0.1.0"
description = "Dictado local en Linux con RTX 5070: Win+F para transcribir y copiar al portapapeles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DevPaul" }]
keywords = ["speech-to-text", "whisper", "stt", "cuda", "wayland"]
dependencies = [
    "faster-whisper>=1.0.0",
    "text2num>=3.0",  # números hablados -> dígitos (opcional, numbers_to_digits)
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24",
    "pyperclip>=1.8",
    # ctranslate2 (wheel) está compilado para CUDA 12 y hace dlopen de libcublas.so.12
    # en runtime. Arch instala CUDA 13, así que traemos cuBLAS 12 vía pip y la
    # precargamos con ctypes (ver cuda_libs.py).
    "nvidia-cublas-cu12>=12.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Manos libres: "hey jarvis" (u otro modelo) arranca el dictado sin teclado
wakeword = ["openwakeword>=0.6", "onnxruntime>=1.18"]
# Push-to-talk: mantener la tecla graba y soltarla transcribe (release real)
hold = ["evdev>=1.7"]

[project.scripts]
local-stt = "local_speech_to_text.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Reglas clásicas (pycodestyle core + pyflakes). Pinneo explícito: los
# defaults de ruff cambian entre versiones y el CI debe ser estable.
select = ["E4", "E7", "E9", "F"]
